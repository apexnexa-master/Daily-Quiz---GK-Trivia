<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1289 460">
  <defs>
    <linearGradient id="wbbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2EEFF"/>
      <stop offset="0.55" stop-color="#EAF4FD"/>
      <stop offset="1" stop-color="#E2F9F0"/>
    </linearGradient>
    <linearGradient id="wbstroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ECFA5"/>
      <stop offset="1" stop-color="#8B6CF3"/>
    </linearGradient>
    <linearGradient id="wbmintchip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3EE6B0"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="wbirischip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B79CFF"/>
      <stop offset="1" stop-color="#7C5CFC"/>
    </linearGradient>
    <linearGradient id="wbbrain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4A0"/>
      <stop offset="1" stop-color="#06AED4"/>
    </linearGradient>
    <radialGradient id="wbgMint">
      <stop offset="0" stop-color="#3EE6B0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3EE6B0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wbgIris">
      <stop offset="0" stop-color="#B79CFF" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#B79CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wbgRose">
      <stop offset="0" stop-color="#FB7185" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wbgCyan">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1289" height="460" fill="url(#wbbg)"/>

  <!-- ambient glows -->
  <circle cx="200" cy="420" r="250" fill="url(#wbgMint)"/>
  <circle cx="320" cy="180" r="240" fill="url(#wbgIris)"/>
  <circle cx="1120" cy="90" r="230" fill="url(#wbgRose)"/>
  <circle cx="700" cy="420" r="240" fill="url(#wbgCyan)"/>

  <!-- faint dot grid, bottom-left -->
  <g fill="#7C5CFC" fill-opacity="0.16"><circle cx="92" cy="332" r="3.5"/><circle cx="122" cy="332" r="3.5"/><circle cx="152" cy="332" r="3.5"/><circle cx="92" cy="362" r="3.5"/><circle cx="122" cy="362" r="3.5"/><circle cx="152" cy="362" r="3.5"/><circle cx="92" cy="392" r="3.5"/><circle cx="122" cy="392" r="3.5"/><circle cx="152" cy="392" r="3.5"/></g>

  <!-- orbit around the hero -->
  <ellipse cx="290" cy="232" rx="192" ry="70" fill="none" stroke="#7C5CFC" stroke-opacity="0.20" stroke-width="2.5" stroke-dasharray="3 14" stroke-linecap="round" transform="rotate(-14 290 232)"/>

  <!-- hero glass tile -->
  <rect x="170" y="112" width="240" height="240" rx="68" fill="#FFFFFF" fill-opacity="0.78" stroke="url(#wbstroke)" stroke-width="3.5"/>

  <!-- brain logo -->
  <g transform="translate(290 234)">
    <g fill="url(#wbbrain)">
      <circle cx="0" cy="-16" r="40"/>
      <circle cx="-36" cy="-2" r="27"/>
      <circle cx="36" cy="-2" r="27"/>
      <circle cx="-24" cy="26" r="25"/>
      <circle cx="24" cy="26" r="25"/>
      <rect x="-44" y="6" width="88" height="42" rx="21"/>
    </g>
    <path d="M 0 -54 V 46" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
      <path d="M -18 -22 q -14 8 -5 22 q 7 12 -3 20"/>
      <path d="M 18 -22 q 14 8 5 22 q -7 12 3 20"/>
    </g>
    <circle cx="-14" cy="-38" r="4" fill="#FFFFFF" fill-opacity="0.9"/>
    <circle cx="16" cy="-34" r="3" fill="#FFFFFF" fill-opacity="0.7"/>
  </g>

  <!-- floating bolt chip -->
  <g transform="translate(444 112)">
    <rect x="-28" y="-28" width="56" height="56" rx="17" fill="url(#wbmintchip)"/>
    <path d="M 5 -17 L -13 4 L -2 4 L -6 18 L 13 -3 L 2 -3 Z" fill="#FFFFFF"/>
  </g>

  <!-- floating dumbbell chip -->
  <g transform="translate(150 356) rotate(-10)">
    <rect x="-26" y="-26" width="52" height="52" rx="16" fill="url(#wbirischip)"/>
    <rect x="-21" y="-9" width="10" height="18" rx="4.5" fill="#FFFFFF"/>
    <rect x="11" y="-9" width="10" height="18" rx="4.5" fill="#FFFFFF"/>
    <rect x="-12" y="-4" width="24" height="8" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- gold sparkle + accents -->
  <path d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z" transform="translate(498 328)" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="396" cy="304" r="5" fill="#F43F5E" fill-opacity="0.65"/>
  <circle cx="520" cy="76" r="5" fill="#10B981" fill-opacity="0.55"/>
  <circle cx="700" cy="400" r="5" fill="#4C566F" fill-opacity="0.30"/>
  <circle cx="950" cy="120" r="4" fill="#8B5CF6" fill-opacity="0.45"/>
  <circle cx="820" cy="220" r="3.5" fill="#7C5CFC" fill-opacity="0.50"/>

  <!-- quiet corner motifs under the text zone -->
  <circle cx="1150" cy="345" r="22" fill="none" stroke="#7C5CFC" stroke-opacity="0.25" stroke-width="2.5"/>
  <path d="M1208 100h22M1219 89v22" stroke="#10B981" stroke-opacity="0.30" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1042" cy="86" r="3" fill="#4C566F" fill-opacity="0.35"/>
</svg>
